include classpath("application.conf")

# Local SQS-compatible queues (ADR-007). Mirrors the AWS setup: a Standard queue with a
# redrive policy to a dedicated DLQ after 5 receives.
node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  catalog-enquiry-events {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "catalog-enquiry-events-dlq"
      maxReceiveCount = 5
    }
  }
  catalog-enquiry-events-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
}
