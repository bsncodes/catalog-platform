# Local API Gateway + static frontend (mirrors CloudFront -> S3 for assets and API Gateway -> Catalog for /api/*).

# Propagate a caller-supplied correlation id, otherwise generate one per request.
map $http_x_correlation_id $correlation_id {
  default $http_x_correlation_id;
  ""      $request_id;
}

upstream catalog_public {
  server catalog:3000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  client_max_body_size 16k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://fakestoreapi.com data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Public Catalog API: the only backend route exposed to the browser.
  # ^~ so this prefix wins over the catch-all regex location below.
  location ^~ /api/catalog/ {
    proxy_pass http://catalog_public;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (not append) so clients cannot spoof the address used for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $correlation_id;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;
    # Upstream JSON errors pass through unchanged; only gateway-generated failures are rewritten.
    proxy_intercept_errors off;
    error_page 502 503 = @catalog_unavailable;
    error_page 504 = @catalog_timeout;
  }

  # Consistent JSON for failures generated by the gateway itself (Catalog unreachable or too slow).
  location @catalog_unavailable {
    default_type application/json;
    add_header X-Correlation-ID $correlation_id always;
    return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The catalogue service is temporarily unavailable. Please try again shortly.","requestId":"$correlation_id"}}';
  }

  location @catalog_timeout {
    default_type application/json;
    add_header X-Correlation-ID $correlation_id always;
    return 504 '{"error":{"code":"UPSTREAM_TIMEOUT","message":"The catalogue service did not respond in time.","requestId":"$correlation_id"}}';
  }

  # Anything else under /api, plus internal and health routes, is not routed by the Gateway.
  location ~ ^/(api|internal|health)(/|$) {
    default_type application/json;
    return 404 '{"error":{"code":"ROUTE_NOT_FOUND","message":"The requested resource does not exist."}}';
  }

  # Hashed build assets can be cached aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Client-side routes fall back to the SPA shell.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://fakestoreapi.com data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
