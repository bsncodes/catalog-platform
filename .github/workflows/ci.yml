name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (PostgreSQL + ElasticMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-admin-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.12
        ports: ["9324:9324"]
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:ci-admin-password@127.0.0.1:5432/postgres
      TEST_SQS_ENDPOINT: http://127.0.0.1:9324
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for ElasticMQ
        run: |
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:9324/?Action=ListQueues" >/dev/null && exit 0
            sleep 2
          done
          echo "ElasticMQ did not become ready" && exit 1
      - run: pnpm test:integration

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Prepare offline environment
        run: |
          cp .env.example .env
          # Deterministic CI: use the committed product snapshot instead of the live Fake Store API.
          sed -i 's/^PRODUCT_PROVIDER=.*/PRODUCT_PROVIDER=fixture/' .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for Catalog Service to become healthy
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q catalog)" 2>/dev/null || true)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify catalogue and enquiry intake
        run: |
          set -euo pipefail
          api() { docker compose exec -T catalog wget -qO- "$@"; }
          test "$(api http://127.0.0.1:3000/api/catalog/products/featured | jq '.data.products | length')" = "5"
          test "$(api "http://127.0.0.1:3000/api/catalog/categories/jewelery/products" | jq '.data.topRated | length')" -ge 1
          response=$(api --header 'Content-Type: application/json' \
            --post-data '{"entity":{"type":"PRODUCT","id":"3"},"customer":{"name":"CI Smoke","email":"ci@example.com","phone":"+919876543210"}}' \
            http://127.0.0.1:3000/api/catalog/enquiries)
          echo "$response" | jq -e '.status == "RECEIVED"'
          enquiry_id=$(echo "$response" | jq -r '.enquiryId')
          for _ in $(seq 1 15); do
            published=$(docker compose exec -T postgres psql -U postgres -d catalog -tAc \
              "select count(*) from outbox_events where aggregate_id = '$enquiry_id' and published_at is not null")
            [ "$published" = "1" ] && exit 0
            sleep 1
          done
          echo "Outbox event was not published to ElasticMQ" && exit 1
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
